<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>Réservations — Restaurants pédagogiques</title>
    <link rel="preconnect" href="https://script.google.com" crossorigin="anonymous" />
    <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin="anonymous" />
    <script>
      (function () {
        try {
          var since = "";
          var c = JSON.parse(localStorage.getItem("reservations-cache-v1") || "null");
          if (c && c.etag && Date.now() - c.savedAt < 12096e5) since = c.etag;
          var u =
            "https://script.google.com/macros/s/SPIKE_FAKE_DEPLOYMENT/exec" +
            (since ? "?since=" + encodeURIComponent(since) : "");
          var r = fetch(u);
          r.catch(function () {});
          window.__EARLY_FETCH__ = { since: since, response: r, startedAt: performance.now() };
        } catch (e) {}
      })();
    </script>
    <script type="module" src="./main.tsx"></script>
  </head>
  <body>
    <div id="root">
      <main data-testid="skeleton" aria-busy="true"><h1>Chargement…</h1></main>
    </div>
  </body>
</html>
