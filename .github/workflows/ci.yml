# Checks every push to main and to the integration branch, and every pull request (PLAN § 3.1, P0).
# Nothing is deployed before the switch: the deploy job only runs on a push to main (PLAN § 7, R-29).
# Actions are pinned by commit SHA (git ls-remote --tags), version in the trailing comment.
name: CI

on:
  push:
    branches: [main, claude/frontend-react-migration-lw5zfz]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash # bash -eo pipefail: a failing command fails the step

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm from packageManager, Node from .node-version, then pnpm install --frozen-lockfile.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node
          node-version-file: .node-version
          cache: true
          require-lockfile: true

      - name: Messages extracted (translations/fr.json up to date)
        run: |
          pnpm i18n:extract
          git diff --exit-code translations/fr.json
      - name: No escaped no-break space in messages (PLAN § 3.10, R-34)
        run: |
          if grep -nF '\\u00A0' translations/fr.json; then
            echo "::error file=translations/fr.json::\\u00A0 written in an attribute between quotes is not interpreted"
            exit 1
          fi
      - run: pnpm format:check
      - run: pnpm lint -f github
      - run: pnpm typecheck
      - run: pnpm test:node
      - run: pnpm knip
      - name: Effects budget (PLAN § 1.5, S6)
        run: |
          effects=$(grep -rnE 'use(Layout)?Effect\(' src --include=*.tsx --include=*.ts \
            --exclude=*.test.* --exclude=*.stories.tsx --exclude-dir=test || true)
          count=0
          while IFS=: read -r file line _; do
            [ -n "$file" ] || continue
            count=$((count + 1))
            echo "$file:$line"
            if ! sed -n "$((line - 1))p" "$file" | grep -qE '^\s*(//|\*)'; then
              echo "::error file=$file,line=$line::effect without a comment on the line above (S6)"
              exit 1
            fi
          done <<< "$effects"
          if [ "$count" -gt 2 ]; then
            echo "::error::$count effects in src, 2 at most (S6)"
            exit 1
          fi

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node
          node-version-file: .node-version
          cache: true
          require-lockfile: true
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Downloads Chromium unless the cache restored it; installs the system libraries in every case.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:browser
      # Stories as tests checked by axe, from P3 (0) on (PLAN § 1.5, S5).
      - if: hashFiles('.storybook/main.ts') != ''
        run: pnpm test --project=storybook

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Regression scenarios already green on the React build (PLAN § 3.1: filtered until P7), by id or title.
      # Empty: the react project does not run. P4 (d): every scenario of P4 and the checks of the suite itself;
      # P5 (a): the login panel (REG-27, the only scenario tagged @L-01).
      E2E_REACT_GREP: "@p4|@framework|@L-01|@G-08|@C-11|delete a booking in two clicks"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node
          node-version-file: .node-version
          cache: true
          require-lockfile: true

      - run: pnpm build:e2e
      - name: Route tree up to date (src/routeTree.gen.ts committed)
        run: git diff --exit-code src/routeTree.gen.ts

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium

      # react-only: new code (smoke, hydration); legacy: regression suite on the old site (P1).
      # retries: 1 comes from playwright.config.ts when CI is set.
      - name: E2E (react-only, legacy)
        run: pnpm test:e2e --project=react-only --project=legacy
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/react-only-legacy
      - name: E2E (react, filtered by tags)
        if: env.E2E_REACT_GREP != ''
        run: pnpm test:e2e --project=react --grep "$E2E_REACT_GREP"
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/react

      # Production build, as the deploy job will publish it. Without the repository variable the build
      # still succeeds and the site shows the configuration banner (D-05, G-05).
      - name: Repository variable VITE_APPS_SCRIPT_URL missing
        if: vars.VITE_APPS_SCRIPT_URL == ''
        run: echo "::warning::Repository variable VITE_APPS_SCRIPT_URL is not set, the build has no script URL (D-05 banner)"
      - name: Production build
        run: pnpm build
        env:
          BASE_PATH: /reservations-restaurants/
          VITE_APPS_SCRIPT_URL: ${{ vars.VITE_APPS_SCRIPT_URL }}
      - name: No mock service worker in the build (PLAN § 7, R-28)
        run: |
          test ! -e dist/client/mockServiceWorker.js
          if grep -rl 'setupWorker\|mockServiceWorker' dist/client; then exit 1; fi
      - run: pnpm budget

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-client
          path: dist/client
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Active from the switch (P8) only: a push to main publishes the dist/client artifact of this run.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check, browser, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-client
          path: dist/client
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/client
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
